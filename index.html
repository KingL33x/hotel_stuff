<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
<meta charset="utf-8">
<title>Study Rooms (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>@charset "UTF-8";:root{--govuk-frontend-version:"5.14.0";--govuk-breakpoint-mobile:20rem;--govuk-frontend-breakpoint-mobile:var(--govuk-breakpoint-mobile);--govuk-breakpoint-tablet:40.0625rem;--govuk-frontend-breakpoint-tablet:var(--govuk-breakpoint-tablet);--govuk-breakpoint-desktop:48.0625rem;--govuk-frontend-breakpoint-desktop:var(--govuk-breakpoint-desktop)}.govuk-link{font-family:arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-decoration:underline;text-decoration-thickness:max(1px,.0625rem);text-underline-offset:.1578em}

</style>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.ph{height:56px;margin-bottom:10px}
.big{height:140px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:20px}
.card{list-style:none;border:1px solid #b1b4b6;padding:15px;margin-bottom:15px}
.off{background:#f3f2f1}
.nav{margin:0 0 10px;padding:0}.nav li{display:inline-block;margin-right:20px}
.scroll{overflow-x:auto}
[tabindex="-1"]:focus{outline:none}
.govuk-error-summary:focus,.govuk-error-summary [tabindex]:focus{outline:3px solid #fd0}
</style>
</head>
<body class="govuk-template__body js-enabled">
<a href="#main" class="govuk-skip-link" data-act="skip">Skip to main content</a>

<!-- HEADER (shared): generic service name, no logo -->
<header class="govuk-header">
  <div class="govuk-header__container govuk-width-container">
    <div class="govuk-header__content" style="width:100%">
      <a href="#" class="govuk-header__link govuk-header__service-name" data-go="home">Study Rooms</a>
    </div>
  </div>
</header>

<div class="govuk-width-container">
  <div class="govuk-phase-banner">
    <p class="govuk-phase-banner__content"><strong class="govuk-tag govuk-phase-banner__content__tag">Prototype</strong>
    <span class="govuk-phase-banner__text">Student project. All rooms and bookings are made up.</span></p>
  </div>
  <nav aria-label="Menu"><ul class="govuk-list nav">
    <li><a class="govuk-link" href="#" data-go="home">Find a room</a></li>
    <li><a class="govuk-link" href="#" data-go="bookings">My bookings</a></li>
    <li><a class="govuk-link" href="#" data-act="nyi">Help</a></li>
  </ul></nav>
  <main class="govuk-main-wrapper" id="main" tabindex="-1"><div id="app"></div></main>
</div>

<!-- FOOTER (shared), includes Reset prototype -->
<footer class="govuk-footer">
  <div class="govuk-width-container">
    <ul class="govuk-footer__inline-list">
      <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="#" data-act="nyi">Accessibility statement</a></li>
      <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="#" data-act="nyi">Contact the library</a></li>
      <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="#" data-act="reset">Reset prototype</a></li>
    </ul>
    <span class="govuk-footer__licence-description">Student prototype. Not a real service.</span>
  </div>
</footer>

<script>
/* ---------- FAKE DATA (in memory only) ---------- */
var ROOMS=[
{id:1,n:"Quiet Room 1.04",b:"Brindley Library",fl:"1st floor",cap:4,f:["Whiteboard","Power sockets"],busy:[[14,16]]},
{id:2,n:"Quiet Room 1.06",b:"Brindley Library",fl:"1st floor",cap:2,f:["Power sockets"],busy:[]},
{id:3,n:"Study Pod 2.01",b:"Brindley Library",fl:"2nd floor",cap:6,f:["Screen","Power sockets","Step-free access"],busy:[[13,15]]},
{id:4,n:"Group Room 2.10",b:"Brindley Library",fl:"2nd floor",cap:10,f:["Whiteboard","Screen","Power sockets","Step-free access"],busy:[]},
{id:5,n:"Room A12",b:"Ashworth Science Hub",fl:"Ground floor",cap:4,f:["Whiteboard","Power sockets","Step-free access"],busy:[]},
{id:6,n:"Room A14",b:"Ashworth Science Hub",fl:"Ground floor",cap:4,f:["Screen","Step-free access"],busy:[[15,17]]},
{id:7,n:"Room B03",b:"Ashworth Science Hub",fl:"Basement",cap:8,f:["Whiteboard","Screen"],busy:[]},
{id:8,n:"Booth 0.5",b:"Kemp Hall",fl:"Ground floor",cap:3,f:["Power sockets","Step-free access"],busy:[]},
{id:9,n:"Study Room 1.2",b:"Kemp Hall",fl:"1st floor",cap:5,f:["Whiteboard","Power sockets"],busy:[]},
{id:10,n:"Seminar Room 1.8",b:"Kemp Hall",fl:"1st floor",cap:6,f:["Whiteboard","Screen","Step-free access"],busy:[[14,18]]}];
var BUILDINGS=["Brindley Library","Ashworth Science Hub","Kemp Hall"];
var FACS=["Whiteboard","Screen","Power sockets","Step-free access"];
var COL={"Brindley Library":"#1d70b8","Ashworth Science Hub":"#00703c","Kemp Hall":"#4c2c92"};
var FID={date:"date-day",s:"start",e:"end",g:"group"};

/* ---------- STATE ---------- */
var $=function(s){return document.querySelector(s)};
var tm=new Date(Date.now()+864e5);
var key=function(y,m,d){return +y+"-"+ +m+"-"+ +d};
var TK=key(tm.getFullYear(),tm.getMonth()+1,tm.getDate());
function init(){return{screen:"home",msg:"",err:null,q:{d:tm.getDate(),m:tm.getMonth()+1,y:tm.getFullYear(),s:"",e:"",g:""},flt:{b:[],f:[]},room:null,bk:[],cnt:0,ref:""}}
var S=init();
var hr=function(h){h=+h;return h===12?"12pm":h>12?(h-12)+"pm":h+"am"};
function dstr(q){var dt=new Date(+q.y,+q.m-1,+q.d);return(key(q.y,q.m,q.d)===TK?"Tomorrow, ":"")+dt.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function when(q){return dstr(q)+", "+hr(q.s)+" to "+hr(q.e)}
function busy(r,q){var k=key(q.y,q.m,q.d),s=+q.s,e=+q.e,ov=function(a,b){return s<b&&e>a};
return(k===TK&&r.busy.some(function(x){return ov(x[0],x[1])}))||S.bk.some(function(x){return x.r===r.id&&x.k===k&&ov(x.s,x.e)})}
function roomById(id){return ROOMS.filter(function(r){return r.id===+id})[0]}

/* ---------- HELPERS ---------- */
function errMsg(id,k){return S.err&&S.err[k]?'<p id="'+id+'-error" class="govuk-error-message"><span class="govuk-visually-hidden">Error:</span> '+S.err[k]+'</p>':""}
function eg(k){return S.err&&S.err[k]?" govuk-form-group--error":""}
function ei(k){return S.err&&S.err[k]?" govuk-input--error":""}
function back(to){return '<a href="#" class="govuk-back-link" data-go="'+to+'">Back</a>'}
function summ(){if(!S.err)return"";return'<div class="govuk-error-summary" data-module="govuk-error-summary"><div role="alert"><h2 class="govuk-error-summary__title">There is a problem</h2><div class="govuk-error-summary__body"><ul class="govuk-list govuk-error-summary__list">'+Object.keys(S.err).map(function(k){return'<li><a href="#'+FID[k]+'" data-f="'+FID[k]+'">'+S.err[k]+'</a></li>'}).join("")+'</ul></div></div></div>'}
function opts(a,b,sel){var o='<option value="">Select</option>';for(var h=a;h<=b;h++)o+='<option value="'+h+'"'+(String(h)===String(sel)?" selected":"")+'>'+hr(h)+'</option>';return o}
function row(k,v,go,hid){return'<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">'+k+'</dt><dd class="govuk-summary-list__value">'+v+'</dd>'+(go?'<dd class="govuk-summary-list__actions"><a class="govuk-link" href="#" data-go="'+go+'">Change<span class="govuk-visually-hidden"> '+hid+'</span></a></dd>':"")+'</div>'}

/* ---------- SCREENS ---------- */
var SC={};

/* SCREEN 1: HOME with quick search */
SC.home=function(){var q=S.q;
return summ()+'<h1 class="govuk-heading-l">Find a study room</h1><p class="govuk-body">Tell us when you need a room and how many people are coming.</p>'+
'<form data-form="search" novalidate>'+
'<div class="govuk-form-group'+eg("date")+'"><fieldset class="govuk-fieldset" role="group" aria-describedby="date-hint'+(S.err&&S.err.date?" date-error":"")+'"><legend class="govuk-fieldset__legend govuk-fieldset__legend--s">Date</legend><div id="date-hint" class="govuk-hint">For example, '+tm.getDate()+" "+(tm.getMonth()+1)+" "+tm.getFullYear()+'</div>'+errMsg("date","date")+
'<div class="govuk-date-input"><div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="date-day">Day</label><input class="govuk-input govuk-date-input__input govuk-input--width-2'+ei("date")+'" id="date-day" name="d" type="text" inputmode="numeric" value="'+q.d+'"></div></div>'+
'<div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="date-month">Month</label><input class="govuk-input govuk-date-input__input govuk-input--width-2'+ei("date")+'" id="date-month" name="m" type="text" inputmode="numeric" value="'+q.m+'"></div></div>'+
'<div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="date-year">Year</label><input class="govuk-input govuk-date-input__input govuk-input--width-4'+ei("date")+'" id="date-year" name="y" type="text" inputmode="numeric" value="'+q.y+'"></div></div></div></fieldset></div>'+
'<div class="govuk-form-group'+eg("s")+'"><label class="govuk-label govuk-label--s" for="start">Start time</label>'+errMsg("start","s")+'<select class="govuk-select'+(S.err&&S.err.s?" govuk-select--error":"")+'" id="start" name="s">'+opts(8,19,q.s)+'</select></div>'+
'<div class="govuk-form-group'+eg("e")+'"><label class="govuk-label govuk-label--s" for="end">End time</label>'+errMsg("end","e")+'<select class="govuk-select'+(S.err&&S.err.e?" govuk-select--error":"")+'" id="end" name="e">'+opts(9,20,q.e)+'</select></div>'+
'<div class="govuk-form-group'+eg("g")+'"><label class="govuk-label govuk-label--s" for="group">How many people?</label><div id="group-hint" class="govuk-hint">Rooms seat between 2 and 10 people</div>'+errMsg("group","g")+'<input class="govuk-input govuk-input--width-3'+ei("g")+'" id="group" name="g" type="text" inputmode="numeric" aria-describedby="group-hint'+(S.err&&S.err.g?" group-error":"")+'" value="'+q.g+'"></div>'+
'<button class="govuk-button" type="submit">Find a room</button></form>'+
'<p class="govuk-body"><a class="govuk-link" href="#" data-go="bookings">See my bookings</a></p>'};

/* SCREEN 2: RESULTS with filters */
SC.results=function(){var q=S.q,g=+q.g,F=S.flt,act=F.b.length||F.f.length;
var list=ROOMS.filter(function(r){return r.cap>=g&&(!F.b.length||F.b.indexOf(r.b)>-1)&&F.f.every(function(f){return r.f.indexOf(f)>-1})});
var av=list.filter(function(r){return!busy(r,q)}),bz=list.filter(function(r){return busy(r,q)});
var card=function(r,free){return'<li class="card'+(free?"":" off")+'"><div class="ph" style="background:'+COL[r.b]+'" aria-hidden="true"></div><h3 class="govuk-heading-s govuk-!-margin-bottom-1">'+(free?'<a class="govuk-link" href="#" data-room="'+r.id+'">'+r.n+'<span class="govuk-visually-hidden">, '+r.b+'</span></a>':r.n)+'</h3><p class="govuk-body-s govuk-!-margin-bottom-2">'+r.b+", "+r.fl+" · Seats up to "+r.cap+'</p><p class="govuk-body-s govuk-!-margin-bottom-2">'+r.f.join(", ")+'</p><strong class="govuk-tag '+(free?"govuk-tag--green":"govuk-tag--grey")+'">'+(free?"Available":"Booked")+'</strong></li>'};
var chk=function(name,arr,sel){return arr.map(function(v,i){return'<div class="govuk-checkboxes__item"><input class="govuk-checkboxes__input" id="'+name+i+'" name="'+name+'" type="checkbox" value="'+v+'"'+(sel.indexOf(v)>-1?" checked":"")+'><label class="govuk-label govuk-checkboxes__label" for="'+name+i+'">'+v+'</label></div>'}).join("")};
return back("home")+'<h1 class="govuk-heading-l">Rooms for '+g+(g===1?" person":" people")+'</h1><p class="govuk-body">'+when(q)+'. <a class="govuk-link" href="#" data-go="home">Change search<span class="govuk-visually-hidden"> details</span></a></p>'+
'<details class="govuk-details"'+(act?" open":"")+'><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Filter by building and facilities'+(act?" (on)":"")+'</span></summary><div class="govuk-details__text"><form data-form="filter">'+
'<div class="govuk-form-group"><fieldset class="govuk-fieldset"><legend class="govuk-fieldset__legend govuk-fieldset__legend--s">Building</legend><div class="govuk-checkboxes govuk-checkboxes--small">'+chk("b",BUILDINGS,F.b)+'</div></fieldset></div>'+
'<div class="govuk-form-group"><fieldset class="govuk-fieldset"><legend class="govuk-fieldset__legend govuk-fieldset__legend--s">Facilities</legend><div class="govuk-checkboxes govuk-checkboxes--small">'+chk("f",FACS,F.f)+'</div></fieldset></div>'+
'<div class="govuk-button-group"><button class="govuk-button" type="submit">Apply filters</button><a class="govuk-link" href="#" data-act="clear">Clear filters</a></div></form></div></details>'+
(list.length?'<h2 class="govuk-heading-m">'+av.length+(av.length===1?" room":" rooms")+' available</h2>'+(av.length?'<ul class="govuk-list">'+av.map(function(r){return card(r,1)}).join("")+'</ul>':'<p class="govuk-body">No rooms are free at this time. Try a different time or fewer filters.</p>')+(bz.length?'<h2 class="govuk-heading-m">Booked at this time</h2><ul class="govuk-list">'+bz.map(function(r){return card(r,0)}).join("")+'</ul>':""):
'<div class="govuk-inset-text">No rooms match your search and filters. <a class="govuk-link" href="#" data-act="clear">Clear filters</a> or <a class="govuk-link" href="#" data-go="home">change your search</a>.</div>')};

/* SCREEN 3: ROOM DETAILS */
SC.room=function(){var r=S.room,q=S.q;
return back("results")+'<h1 class="govuk-heading-l">'+r.n+'</h1><div class="big" style="background:'+COL[r.b]+'" role="img" aria-label="Photo placeholder for '+r.n+'">Photo placeholder</div>'+
'<dl class="govuk-summary-list govuk-summary-list--no-border">'+row("Building",r.b)+row("Floor",r.fl)+row("Seats",r.cap+" people")+row("Your time",when(q))+'</dl>'+
'<h2 class="govuk-heading-m">Facilities</h2><p class="govuk-body">'+r.f.map(function(f){return'<strong class="govuk-tag govuk-tag--grey">'+f+'</strong>'}).join(" ")+'</p>'+
'<button class="govuk-button" data-go="confirm">Book this room</button>'};

/* SCREEN 4: CONFIRM BOOKING (check answers) */
SC.confirm=function(){var r=S.room,q=S.q;
return back("room")+'<h1 class="govuk-heading-l">Check your booking</h1><dl class="govuk-summary-list">'+
row("Room",r.n+", "+r.b,"results","room")+row("Date",dstr(q),"home","date")+row("Time",hr(q.s)+" to "+hr(q.e),"home","time")+row("Group size",q.g+(+q.g===1?" person":" people"),"home","group size")+'</dl>'+
'<div class="govuk-warning-text"><span class="govuk-warning-text__icon" aria-hidden="true">!</span><strong class="govuk-warning-text__text"><span class="govuk-visually-hidden">Warning</span>You can cancel up to 1 hour before your booking starts. Rooms not used within 15 minutes may be given to someone else.</strong></div>'+
'<form data-form="confirm"><button class="govuk-button" type="submit">Confirm booking</button></form>'};

/* SCREEN 5: SUCCESS with booking reference */
SC.done=function(){var r=S.room;
return'<div class="govuk-panel govuk-panel--confirmation"><h1 class="govuk-panel__title">Booking confirmed</h1><div class="govuk-panel__body">Your booking reference<br><strong>'+S.ref+'</strong></div></div>'+
'<h2 class="govuk-heading-m">What happens next</h2><p class="govuk-body">Go to '+r.n+" in "+r.b+" ("+r.fl+"). Your room is booked for "+when(S.q)+'.</p><p class="govuk-body">Keep your reference in case you need it.</p>'+
'<button class="govuk-button" data-go="bookings">View my bookings</button><p class="govuk-body"><a class="govuk-link" href="#" data-go="home">Book another room</a></p>'};

/* SCREEN 6: MY BOOKINGS */
SC.bookings=function(){var rows=S.bk.slice().reverse().map(function(b){var r=roomById(b.r);
return'<tr class="govuk-table__row"><td class="govuk-table__cell">'+r.n+", "+r.b+"<br>"+when(b.q)+'</td><th scope="row" class="govuk-table__header">'+b.ref+'</th><td class="govuk-table__cell"><strong class="govuk-tag govuk-tag--green">Confirmed</strong><br><a class="govuk-link" href="#" data-act="nyi">Cancel<span class="govuk-visually-hidden"> '+b.ref+'</span></a></td></tr>'}).join("");
rows+='<tr class="govuk-table__row"><td class="govuk-table__cell">Quiet Room 1.02, Brindley Library<br>Monday 9 November 2026, 11am to 12pm</td><th scope="row" class="govuk-table__header">SR-3107</th><td class="govuk-table__cell"><strong class="govuk-tag govuk-tag--grey">Completed</strong></td></tr>';
return'<h1 class="govuk-heading-l">My bookings</h1><div class="scroll"><table class="govuk-table"><caption class="govuk-table__caption govuk-visually-hidden">Your bookings</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Room and time</th><th scope="col" class="govuk-table__header">Reference</th><th scope="col" class="govuk-table__header">Status</th></tr></thead><tbody class="govuk-table__body">'+rows+'</tbody></table></div>'+
'<p class="govuk-body"><a class="govuk-link" href="#" data-go="home">Find another room</a></p>'};

/* ---------- RENDER AND NAVIGATION ---------- */
function render(){var m=$("#app");
m.innerHTML=(S.msg?'<div class="govuk-inset-text" role="status" id="msg" tabindex="-1">'+S.msg+'</div>':"")+SC[S.screen]();
var t=S.msg?$("#msg"):$(".govuk-error-summary [role=alert]")||$("#app h1");
if(t){t.setAttribute("tabindex","-1");t.focus()}
S.msg="";S.err=null;window.scrollTo(0,0)}
function go(s){S.screen=s;S.err=null;render()}

document.addEventListener("click",function(e){
var t=e.target.closest("[data-go],[data-room],[data-act],[data-f]");if(!t)return;e.preventDefault();
if(t.dataset.f){var el=document.getElementById(t.dataset.f);if(el)el.focus();return}
if(t.dataset.room){S.room=roomById(t.dataset.room);return go("room")}
if(t.dataset.go)return go(t.dataset.go);
var a=t.dataset.act;
if(a==="nyi"){S.msg="This part isn't in the prototype yet.";render()}
else if(a==="reset"){S=init();render()}
else if(a==="clear"){S.flt={b:[],f:[]};render()}
else if(a==="skip"){$("#main").focus()}});

document.addEventListener("submit",function(e){e.preventDefault();var f=e.target,fd=new FormData(f),w=f.dataset.form;
if(w==="search"){
var q={d:fd.get("d").trim(),m:fd.get("m").trim(),y:fd.get("y").trim(),s:fd.get("s"),e:fd.get("e"),g:fd.get("g").trim()},er={};
if(!q.d||!q.m||!q.y)er.date="Enter a date, including the day, month and year";
else{var dt=new Date(+q.y,+q.m-1,+q.d),today=new Date();today.setHours(0,0,0,0);
if(!/^\d+$/.test(q.d+q.m+q.y)||q.y.length!==4||dt.getDate()!==+q.d||dt.getMonth()!==+q.m-1)er.date="Date must be a real date, like "+tm.getDate()+" "+(tm.getMonth()+1)+" "+tm.getFullYear();
else if(dt<today)er.date="Date must be today or in the future"}
if(!q.s)er.s="Select a start time";
if(!q.e)er.e="Select an end time";
else if(q.s&&+q.e<=+q.s)er.e="End time must be after the start time";
if(!q.g)er.g="Enter how many people are coming";
else if(!/^\d+$/.test(q.g)||+q.g<1||+q.g>10)er.g="Group size must be a whole number from 1 to 10";
S.q=q;S.room=null;
if(Object.keys(er).length){S.err=er;S.screen="home";render()}else go("results")}
else if(w==="filter"){S.flt={b:fd.getAll("b"),f:fd.getAll("f")};render()}
else if(w==="confirm"){
if(busy(S.room,S.q)){S.msg="Sorry, that room is no longer free. Choose another room.";return go("results")}
S.cnt++;S.ref="SR-"+(4820+S.cnt);
S.bk.push({ref:S.ref,r:S.room.id,k:key(S.q.y,S.q.m,S.q.d),s:+S.q.s,e:+S.q.e,q:JSON.parse(JSON.stringify(S.q))});
go("done")}});

render();
</script>
</body>
</html>
